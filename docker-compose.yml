name: fluence

services:
  db:
    image: postgres:16
    container_name: fluence-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fluence_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fluence_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-fluence}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fluence_app} -d ${POSTGRES_DB:-fluence}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No host port — internal only. Access via: docker compose exec db psql

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      provenance: false
      sbom: false
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: .env
    environment:
      LAPP_HOST: 0.0.0.0
      LAPP_PORT: ${LAPP_PORT:-5050}
      DATABASE_URL: postgresql://${POSTGRES_USER:-fluence_app}:${POSTGRES_PASSWORD:-fluence_dev_pass}@db:5432/${POSTGRES_DB:-fluence}
      PROD_MEDIA_ROOT: /app/media
      PROD_BACKUP_ROOT: /app/backups
      RESTORE_LATEST_BACKUP: ${RESTORE_LATEST_BACKUP:-false}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5050/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "${LAPP_PORT:-5050}:${LAPP_PORT:-5050}"
    volumes:
      - ${PROD_MEDIA_ROOT:-./media}:/app/media
      - ${PROD_BACKUP_ROOT:-./backups}:/app/backups
      - ${HF_CACHE_DIR:-${HOME}/.cache/huggingface}:/root/.cache/huggingface

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
      provenance: false
      sbom: false
      args:
        LAPP_PUBLIC_HOST: ${LAPP_PUBLIC_HOST:-localhost}
        LAPP_PUBLIC_PORT: ${LAPP_PUBLIC_PORT:-5050}
        LAPP_EXTRA_MEDIA_HOSTS: ${LAPP_EXTRA_MEDIA_HOSTS:-}
    restart: unless-stopped
    environment:
      PORT: 3000
      LAPP_INTERNAL_HOST: backend
      LAPP_INTERNAL_PORT: 5050
    depends_on:
      - backend
    ports:
      - "${PORT:-8080}:3000"

volumes:
  pgdata:
    name: fluence_pgdata
